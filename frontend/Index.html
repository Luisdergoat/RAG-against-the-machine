<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <main class="main">
            <header class="topbar">
                <div class="brand">
                <img src="logo.png" alt="Logo" class="brand-logo">
                    <span>RAG against the machine</span>
                </div>
                <div class="topbar-right">
                    <div class="topbar-info">
                        <div><span class="info-label">Model</span> Qwen3-0.6B</div>
                        <div><span class="info-label">Retrieval</span> BM25 · vLLM 0.10.1</div>
                        <div><span class="info-label">Intra</span> lunsold · 42</div>
                    </div>
                    <span class="status" id="status" data-state="connecting">
                        <span class="status-dot"></span>
                        <span class="status-text">Connecting…</span>
                    </span>
                </div>
            </header>

            <section class="chat" id="chat">
                <div class="empty" id="empty">
                    <img src="logo.png" alt="Logo" class="brand-logo">
                    <h1>Ask anything about vLLM</h1>
                    <p>Questions are answered from the indexed vLLM codebase and docs.</p>
                </div>
            </section>

            <form class="composer" id="composer">
                <div class="composer-box">
                    <textarea id="input" rows="1"
                              placeholder="Send a message…"></textarea>
                    <button id="send" type="submit" aria-label="Send">➔</button>
                </div>
                <p class="hint">Answers are generated by a small local model and can be wrong. Check the sources.</p>
            </form>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
